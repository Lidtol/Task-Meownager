<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <script src="js/app.js" defer></script>
</head>
<body>
<header>
    <h1>Task Meownager</h1>
    <p id="date"></p>
</header>
<main>
    <section id="summary">
        <h2>Resumen</h2>
        <p>Tareas pendientes: <span id="pending-tasks">0</span></p>
        <div id="progress-bar">
            <div id="progress"></div>
        </div>
        <p>Progreso: <span id="progress-percentage">0%</span></p>
    </section>

    <section id="task-form">
        <h2 id="form-title">Añadir Tarea</h2>
        <form id="add-task-form">
            <input type="text" id="task-title" placeholder="Título de la tarea" required>
            <select id="task-priority">
                <option value="alta">Alta</option>
                <option value="media">Media</option>
                <option value="baja">Baja</option>
            </select>
            <input type="text" id="task-category" placeholder="Categoría">
            <button type="submit">Añadir</button>
            <button type="button" id="cancel-edit" hidden>Cancelar</button>
        </form>
    </section>

    <section id="filters">
        <button data-filter="all">Todas</button>
        <button data-filter="pending">Pendientes</button>
        <button data-filter="completed">Completadas</button>
    </section>

    <section id="task-list">
        <!-- Aquí se mostrarán las tarjetas de tareas -->
    </section>

    <footer>
        <button id="clear-completed">Borrar completadas</button>
    </footer>

    <div id="empty-state" style="display: none;">
        <h3></h3>
        <p></p>
        <p></p>
    </div>


</body>
</html>
